# Gate 0's linter (EVALS §5). Pyflakes (F), pycodestyle errors (E4/E7/E9) and bugbear (B).
# Broad `except Exception` is deliberate at the pipeline's step boundaries: each one turns
# any failure into an `error` event naming the step (fail loud, P-4), so it isn't linted here.
line-length = 130
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
